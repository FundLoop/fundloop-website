name: CI

on:
  push:
    branches:
      - dev
      - main
      - codex/**
  pull_request:

jobs:
  supabase-replay:
    name: Supabase fresh-schema replay
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_REPLAY_DB_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Start isolated local database
        run: supabase db start --yes

      - name: Replay migrations and representative SQL suites
        run: pnpm supabase:replay:pr

      - name: Prove invalid migrations fail closed
        run: pnpm supabase:replay:failure-smoke

      - name: Stop isolated local database
        if: always()
        run: supabase stop --no-backup

  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Contracts Test
        run: pnpm --dir contracts test
